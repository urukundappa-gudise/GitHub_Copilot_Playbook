name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: uv sync --project backend --all-extras

      - name: Run backend tests
        run: uv run --project backend pytest -q -o junit_family=legacy --junitxml=backend-test-results.xml

      - name: Upload aggregate backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend-test-results.xml
          if-no-files-found: ignore

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: aimplify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aimplify_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@localhost:5432/aimplify_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: uv sync --project backend --all-extras

      - name: Upgrade a fresh PostgreSQL database through the full migration chain
        run: |
          cd backend
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini current | grep -F '0003_oidc_sessions (head)'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm run test --prefix frontend -- --run

      - name: Type-check frontend
        run: npm run typecheck --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag aimplify-intake:ci .

      - name: Smoke-test production container
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 8000:8000 aimplify-intake:ci)"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "app:app"
          docker inspect --format '{{json .Config.ExposedPorts}}' "$container_id" | grep -q '"8000/tcp"'
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl --silent --fail http://127.0.0.1:8000/health/live | grep -q '"status":"live"'
          docker exec "$container_id" python -c \
            "from pathlib import Path; import aimplify_intake; root=Path('/app'); assert (root/'frontend/dist/index.html').is_file(); forbidden=('.git', '.npm', '.cache', 'pip-cache', 'uv-cache', 'coverage', '.pytest_cache', '.terraform', 'node_modules', '__pycache__'); database_suffixes=('.db', '.db-wal', '.db-shm', '.db-journal', '.sqlite', '.sqlite-wal', '.sqlite-shm', '.sqlite-journal', '.sqlite3', '.sqlite3-wal', '.sqlite3-shm', '.sqlite3-journal'); credential_names=('.aws', '.npmrc', '.netrc', 'credentials', 'id_rsa', 'id_ed25519', '.dockerconfigjson'); assert not [p for p in root.rglob('*') if any(part in forbidden for part in p.parts) or p.name.startswith('.env') or p.name.endswith(database_suffixes) or p.name in credential_names]; print('backend, frontend, and runtime exclusions verified')"
          api_status="$(curl --silent --output /tmp/api-response --write-out '%{http_code}' \
            http://127.0.0.1:8000/api/v1/unknown)"
          test "$api_status" = "404"
          ! grep -qi '<html' /tmp/api-response

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check Terraform formatting
        run: |
          terraform fmt -check -recursive deploy/bootstrap
          terraform fmt -check -recursive deploy/apprunner
          terraform fmt -check -recursive deploy/ecs-express

      - name: Validate bootstrap Terraform
        working-directory: deploy/bootstrap
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - name: Validate App Runner Terraform
        working-directory: deploy/apprunner
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - name: Validate ECS Express Terraform
        working-directory: deploy/ecs-express
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

  security:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate cloud identity policy
        run: >
          python .github/scripts/check_cloud_identity.py
          --workflow .github/workflows/ci.yml
          --trust-config .github/oidc-trust.json

  golden-evaluation:
    needs:
      - backend
      - postgres-migration
      - frontend
      - container-smoke
      - terraform
      - security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: uv sync --project backend --all-extras

      - name: Run golden evaluation gate
        run: uv run --project backend python backend/scripts/run_golden_evaluation.py
