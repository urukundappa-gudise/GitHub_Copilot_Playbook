name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: intake_test
          POSTGRES_PASSWORD: intake_test
          POSTGRES_DB: aimplify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intake_test -d aimplify_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRESQL_URL: postgresql+psycopg://intake_test:intake_test@localhost:5432/aimplify_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: uv sync --locked --project backend --all-extras

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run required verification
        run: pwsh -NoProfile -File scripts/verify.ps1 -Required

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm run test --prefix frontend -- --run

      - name: Type-check frontend
        run: npm run typecheck --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

  security:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate cloud identity policy
        run: >
          python .github/scripts/check_cloud_identity.py
          --workflow .github/workflows/ci.yml
          --trust-config .github/oidc-trust.json

  golden-evaluation:
    needs:
      - backend
      - frontend
      - security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: uv sync --locked --project backend --all-extras

      - name: Run golden evaluation gate
        run: uv run --project backend python backend/scripts/run_golden_evaluation.py
