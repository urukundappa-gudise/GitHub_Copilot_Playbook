name: E2E SSO expiry cleanup

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-sso-expiry
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.E2E_AWS_REGION }}
      STATE_BUCKET: ${{ vars.E2E_STATE_BUCKET }}
      STATE_PREFIX: e2e-sso
      REGISTRY_PREFIX: e2e-sso/registry
      AWS_ROLE_ARN: ${{ vars.AWS_E2E_CLEANUP_ROLE_ARN }}
      ALERT_TOPIC_ARN: ${{ vars.E2E_EXPIRY_ALERT_TOPIC_ARN }}
    steps:
      - name: Check out the protected default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure AWS credentials with repository OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_E2E_CLEANUP_ROLE_ARN }}
          aws-region: ${{ vars.E2E_AWS_REGION }}
          role-session-name: e2e-sso-expiry-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Destroy due isolated stacks
        shell: bash
        run: |
          set -euo pipefail
          : "${STATE_BUCKET:?E2E_STATE_BUCKET repository variable is required}"
          : "${AWS_REGION:?E2E_AWS_REGION repository variable is required}"
          : "${AWS_ROLE_ARN:?AWS_E2E_CLEANUP_ROLE_ARN repository variable is required}"
          : "${ALERT_TOPIC_ARN:?E2E_EXPIRY_ALERT_TOPIC_ARN repository variable is required}"

          keys="$(aws s3api list-objects-v2 \
            --bucket "$STATE_BUCKET" \
            --prefix "$REGISTRY_PREFIX/" \
            --query 'Contents[].Key' \
            --output text)"
          if [[ -z "$keys" || "$keys" == "None" ]]; then
            echo "No registered E2E stacks."
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          failed=0
          for registry_key in $keys; do
            [[ "$registry_key" =~ ^e2e-sso/registry/[a-z0-9][a-z0-9-]{2,23}\.json$ ]] || {
              echo "Unexpected registry key; refusing: $registry_key" >&2
              failed=1
              continue
            }
            manifest="$RUNNER_TEMP/e2e-manifest.json"
            if ! aws s3 cp "s3://${STATE_BUCKET}/${registry_key}" "$manifest" --only-show-errors; then
              echo "Could not read registry item: $registry_key" >&2
              failed=1
              continue
            fi

            stack_id="$(jq -er '.stack_id' "$manifest")"
            owner="$(jq -er '.owner' "$manifest")"
            created_at="$(jq -er '.created_at' "$manifest")"
            expires_at="$(jq -er '.expires_at' "$manifest")"
            state_key="$(jq -er '.state_key' "$manifest")"
            expected_registry_key="${REGISTRY_PREFIX}/${stack_id}.json"
            expected_state_key="${STATE_PREFIX}/stacks/${stack_id}/terraform.tfstate"
            [[ "$registry_key" == "$expected_registry_key" && "$state_key" == "$expected_state_key" ]] || {
              echo "Registry identity/state-key mismatch; refusing: $registry_key" >&2
              failed=1
              continue
            }
            created_epoch="$(date -u -d "$created_at" +%s)"
            expires_epoch="$(date -u -d "$expires_at" +%s)"
            [[ "$((expires_epoch - created_epoch))" -eq 259200 ]] || {
              echo "Invalid lifetime for stack $stack_id; refusing cleanup." >&2
              failed=1
              continue
            }
            cleanup_epoch="$((created_epoch + 68 * 3600))"
            if (( now_epoch < cleanup_epoch )); then
              echo "Stack $stack_id is not due. destroy_after_hours=68 expires_at=$expires_at"
              continue
            fi

            variables_file="$RUNNER_TEMP/e2e-${stack_id}.tfvars.json"
            jq -e --arg bucket "$STATE_BUCKET" --arg key "$state_key" --arg topic "$ALERT_TOPIC_ARN" \
              '.variables.state_bucket_name == $bucket and .variables.state_key == $key and .variables.stack_id == .stack_id and .variables.expiry_alert_topic_arn == $topic and (.variables.azure_ad_client_secret_arn | startswith("arn:"))' \
              "$manifest" >/dev/null
            jq '.variables' "$manifest" > "$variables_file"

            state_object="$RUNNER_TEMP/state-head.json"
            if aws s3api head-object --bucket "$STATE_BUCKET" --key "$state_key" >"$state_object" 2>"$RUNNER_TEMP/state-head.err"; then
              terraform -chdir=deploy/ec2-s3-e2e init -input=false \
                -backend-config="bucket=${STATE_BUCKET}" \
                -backend-config="key=${state_key}" \
                -backend-config="region=${AWS_REGION}" \
                -backend-config="use_lockfile=true" \
                -lockfile=readonly
              if terraform -chdir=deploy/ec2-s3-e2e destroy -input=false -auto-approve -var-file="$variables_file"; then
                aws s3api delete-object --bucket "$STATE_BUCKET" --key "$registry_key" >/dev/null
                echo "Destroyed stack $stack_id (owner=$owner). State is retained for audit."
                echo "### E2E stack destroyed" >> "$GITHUB_STEP_SUMMARY"
                echo "- Stack: \`$stack_id\`" >> "$GITHUB_STEP_SUMMARY"
                echo "- State key: \`$state_key\`" >> "$GITHUB_STEP_SUMMARY"
              else
                failed=1
                message="E2E cleanup failed for stack ${stack_id}; state key ${state_key}; expires ${expires_at}; workflow ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Retry is scheduled every 15 minutes. Owner: ${owner}."
                aws sns publish --topic-arn "$ALERT_TOPIC_ARN" --subject "E2E SSO cleanup retry required" --message "$message" >/dev/null || true
                echo "Terraform destroy failed for $stack_id; manifest retained for retry." >&2
              fi
            else
              if grep -Eqi '404|Not Found|NoSuchKey' "$RUNNER_TEMP/state-head.err"; then
                aws s3api delete-object --bucket "$STATE_BUCKET" --key "$registry_key" >/dev/null
                echo "No Terraform state exists for $stack_id; removed its expired registration."
              else
                failed=1
                message="E2E cleanup could not inspect state for ${stack_id}; state key ${state_key}; workflow ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Owner: ${owner}."
                aws sns publish --topic-arn "$ALERT_TOPIC_ARN" --subject "E2E SSO cleanup inspection failed" --message "$message" >/dev/null || true
                cat "$RUNNER_TEMP/state-head.err" >&2
              fi
            fi
          done
          exit "$failed"
